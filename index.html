    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;

            background: radial-gradient(
                circle at top left,
                #071a3d,
                #0b2d5c 55%,
                #061326
            );

            padding: 14px;
        }

        .container {
            width: 100%;
            max-width: 390px;

            background: rgba(8, 28, 55, 0.88);

            border: 1px solid rgba(75, 150, 255, 0.45);

            border-radius: 18px;

            padding: 18px;

            box-shadow:
                0 16px 36px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(40, 130, 255, 0.12);

            backdrop-filter: blur(5px);
        }

        .header-strip {
            background: linear-gradient(
                90deg,
                #dceeff,
                #8ec5ff
            );

            border-radius: 12px;

            padding: 10px;

            color: #071a32;

            box-shadow:
                inset 0 0 18px rgba(255, 255, 255, 0.22);
        }

        .title {
            margin: 0;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .subtitle {
            margin: 10px 0 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }

        .status-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 8px 0 12px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            padding: 10px 8px;
        }

        .stat-value {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
            color: #bfe0ff;

            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.15);
        }

        .stat-label {
            margin: 2px 0 0;
            font-size: 12px;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .join-fast {
            margin: 6px 0 12px;
            font-size: 18px;
            font-weight: 700;
            color: #9ed0ff;
            animation: pulse 0.7s infinite alternate;
        }

        @keyframes pulse {

            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0.45;
                transform: translateY(-2px);
            }

        }

        /* TELEGRAM BUTTON */

        .join-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: 100%;
            text-decoration: none;
            padding: 12px;
            border-radius: 30px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: 700;
            color: #071a32;

            background: linear-gradient(
                90deg,
                #75baff,
                #3f8cff
            );

            box-shadow:
                0 0 10px rgba(80, 170, 255, 0.55),
                0 0 22px rgba(60, 140, 255, 0.35),
                0 8px 18px rgba(0, 0, 0, 0.22);

            animation:
                telegramPop 1.8s ease-in-out infinite;

            transition:
                transform .22s ease;
        }

        .join-btn:hover {
            transform: scale(1.04);
        }

        @keyframes telegramPop {

            0% {
                transform: scale(1);

                box-shadow:
                    0 0 10px rgba(80, 170, 255, 0.45),
                    0 0 20px rgba(60, 140, 255, 0.25);
            }

            50% {
                transform: scale(1.035);

                box-shadow:
                    0 0 18px rgba(100, 190, 255, 0.85),
                    0 0 35px rgba(60, 140, 255, 0.55);
            }

            100% {
                transform: scale(1);

                box-shadow:
                    0 0 10px rgba(80, 170, 255, 0.45),
                    0 0 20px rgba(60, 140, 255, 0.25);
            }

        }

        /* LOGO */

        .profile {
            margin: 10px 0;
            display: flex;
            justify-content: center;
        }

        .profile img {
            width: 124px;
            height: 124px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            object-fit: cover;

            box-shadow:
                0 0 12px rgba(80, 160, 255, 0.7),
                0 0 28px rgba(60, 140, 255, 0.5),
                0 0 45px rgba(40, 120, 255, 0.25);
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 10px 0;
            font-size: 17px;
            line-height: 1.35;
        }

        .info-list li {
            margin: 3px 0;
        }

        .accuracy {
            margin-top: 12px !important;
            font-size: 16px;
            font-weight: 800;
            line-height: 1.35;
        }

        /* WHATSAPP BUTTON */

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;

            background: linear-gradient(
                -45deg,
                #075e54,
                #128c7e,
                #075e54,
                #128c7e
            );

            background-size: 300% 300%;

            animation:
                flow 3s linear infinite;

            transition:
                transform .22s ease;
        }

        .whatsapp-btn:hover {
            transform: scale(1.03);
        }

        @keyframes flow {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }

        .whatsapp-btn i {
            color: #ffffff;
            font-size: 22px;
        }

        @media (max-width: 480px) {

            .title {
                font-size: 20px;
            }

            .subtitle {
                font-size: 16px;
            }

            .info-list {
                font-size: 16px;
            }

            .accuracy {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header-strip">

            <h1 class="title">
                STARK BHAI
            </h1>

        </div>

        <p class="subtitle">
            👑 KING OF CRICKET TIPPING 👑
        </p>

        <div class="status-row">

            <div class="stat-box">

                <p
                    class="stat-value"
                    id="subCounter">

                    0

                </p>

                <p class="stat-label">
                    SUBSCRIBERS
                </p>

            </div>

            <div class="stat-box">

                <p
                    class="stat-value"
                    id="seconds">

                    20

                </p>

                <p class="stat-label">
                    JOIN TIMER (S)
                </p>

            </div>

        </div>

        <p class="join-fast">
            JOIN FAST <span>👇</span>
        </p>

        <!-- TELEGRAM BUTTON -->
        <a
            href="https://telegram.me/+AgcwI8HCXQ80MWRl"
            class="join-btn"
            id="telegramButton">

            JOIN TELEGRAM CHANNEL

            <i
                class="fa fa-telegram"
                style="font-size:23px;color:#ffffff">
            </i>

        </a>

        <div class="profile">

            <img
                src="stark-bhai-logo.jpeg"
                alt="STARK BHAI">

        </div>

        <ul class="info-list">

            <li>
                👉 𝗜𝗣𝗟 𝟮𝟬𝟮𝟲 - 𝟳𝟯/𝟳𝟰 𝗣𝗔𝗦𝗦 ✔
            </li>

            <li>
                👉 𝗣𝗦𝗟 𝟮𝟬𝟮𝟲 - 𝟯𝟯/𝟯𝟰 𝗣𝗔𝗦𝗦 ✔
            </li>

            <li>
                👉 𝗟𝗣𝗟 𝟮𝟬𝟮𝟲 - 𝟮𝟰/𝟮𝟰 𝗣𝗔𝗦𝗦 ✔
            </li>

            <li>
                👉 𝗕𝗕𝗟 𝟮𝟬𝟮𝟱 - 𝟰𝟮/𝟰𝟰 𝗣𝗔𝗦𝗦 ✔
            </li>

            <li class="accuracy">
                🔥 𝟭𝟬𝟬% 𝗔𝗖𝗖𝗨𝗥𝗔𝗖𝗬 𝗜𝗡 𝗜𝗣𝗟 - 𝗣𝗦𝗟 - 𝗟𝗣𝗟 - 𝗕𝗕𝗟 🔥
            </li>

        </ul>

        <!-- WHATSAPP BUTTON -->
        <a
            href="https://wa.me/message/JO3NOIQOAJOEF1"
            class="whatsapp-btn"
            id="whatsappButton">

            WHATSAPP CHAT

            <i class="fa fa-whatsapp"></i>

        </a>

    </div>

    <script>

        /* SUBSCRIBER COUNTER */

        (function () {

            var target = 66789;

            var count = 0;

            var el =
                document.getElementById("subCounter");

            function tick() {

                if (count < target) {

                    count +=
                        Math.ceil(target / 260);

                    if (count > target) {
                        count = target;
                    }

                    el.textContent =
                        count.toLocaleString();

                    setTimeout(tick, 10);

                } else {

                    el.textContent =
                        target.toLocaleString();

                }

            }

            tick();

        }());


        /* TELEGRAM CLICK = LEAD */

        (function () {

            var telegramButton =
                document.getElementById("telegramButton");

            telegramButton.addEventListener("click", function () {

                fbq("track", "Lead");

            });

        }());


        /* WHATSAPP CLICK = CUSTOM EVENT */

        (function () {

            var whatsappButton =
                document.getElementById("whatsappButton");

            whatsappButton.addEventListener("click", function () {

                fbq("trackCustom", "WhatsAppClick");

            });

        }());


        /* 20 SECOND TIMER
           TIMER ONLY — NO LEAD EVENT
        */

        (function () {

            var seconds = 20;

            var timer =
                document.getElementById("seconds");

            var interval =
                setInterval(function () {

                    if (seconds > 0) {

                        seconds--;

                        timer.textContent =
                            seconds;

                    } else {

                        clearInterval(interval);

                    }

                }, 1000);

        }());

    </script>

</body>

</html>
