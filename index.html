<script>
/* SUBSCRIBER COUNTER */
(function () {
    var target = 15234, count = 0;
    var el = document.getElementById("subCounter");
    function tick() {
        if (count < target) {
            count += Math.ceil(target / 260);
            if (count > target) count = target;
            el.textContent = count.toLocaleString();
            setTimeout(tick, 10);
        } else {
            el.textContent = target.toLocaleString();
        }
    }
    tick();
}());

/* TELEGRAM BUTTON CLICK = LEAD EVENT */
(function () {
    var telegramButton = document.getElementById("telegramButton");
    telegramButton.addEventListener("click", function () {
        if (typeof fbq === "function") fbq("track", "Lead");
    });
}());

/* 20 SECOND TIMER — TIMER ONLY, NO LEAD EVENT */
(function () {
    var seconds = 20;
    var timer = document.getElementById("seconds");
    var interval = setInterval(function () {
        if (seconds > 0) {
            seconds--;
            timer.textContent = seconds;
        } else {
            clearInterval(interval);
        }
    }, 1000);
}());
</script>
